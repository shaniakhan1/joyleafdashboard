<script>
// Data is parsed as JSON, never executed. Only fields with recorded evidence are displayed.
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
}
function ageStatus(status, lastSuccess, now = Date.now()) {
  const age = now - Date.parse(lastSuccess);
  return Number.isFinite(age) && age >= 0 && age < 36 * 3600000 && ['fresh','partial'].includes(status) ? status : 'stale';
}
function periodText(period) {
  if (!period) return 'Period not recorded';
  if (period.start_date && period.end_date) return `${period.start_date} to ${period.end_date}`;
  return period.label || period.month || 'Period not recorded';
}
function dateText(value) {
  const date = new Date(value);
  return value && Number.isFinite(date.getTime()) ? date.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}) : 'Date not recorded';
}
function titleCase(value) {
  return String(value || '').replace(/_/g,' ').replace(/\b\w/g,char => char.toUpperCase());
}
function sourceFreshness(source, statuses, now = Date.now()) {
  const meta = statuses[source] || {};
  if (meta.manual_import) return 'imported report';
  return ageStatus(meta.status,meta.last_success,now);
}
function metricLabel(source, key, statuses) {
  const field = statuses[source]?.metric_status?.[key]?.provider_field;
  if (source === 'facebook' && key === 'views') return field === 'page_impressions' ? 'Content impressions' : 'Views (legacy baseline)';
  if (source === 'facebook' && key === 'interactions') return field === 'page_post_engagements' ? 'Post engagements' : 'Interactions (legacy baseline)';
  if (source === 'linkedin' && key === 'reactions') return field === 'account_analytics_like_count' ? 'Likes' : 'Reactions (legacy baseline)';
  const labels = {searches:'Search & Maps impressions',direction_requests:'Direction requests',phone_calls:'Phone calls',website_clicks:'Website clicks',joyleaf_count:'Google reviews',new_follows:'New follows',new_subs:'Subscribers gained',unique_shoppers:'Unique shoppers',orders:'Orders',gmv:'Order GMV',monthly_spend:'Storefront total spend'};
  return labels[key] || titleCase(key);
}
function metricValue(D, source, key) {
  const metric = D.automation?.source_status?.[source]?.metric_status?.[key];
  const value = D[source]?.[key];
  if (!metric || metric.status === 'invalid' || typeof value !== 'number' || !Number.isFinite(value)) return null;
  if (periodText(metric.period) === 'Period not recorded') return null;
  if (metric.collection_method === 'manual-export') return Number.isFinite(Date.parse(metric.imported_at)) ? value : null;
  return Number.isFinite(Date.parse(metric.last_success)) ? value : null;
}
function metricText(source, key, statuses, now = Date.now()) {
  const metric = statuses[source]?.metric_status?.[key];
  if (!metric) return 'Not verified · Period not recorded';
  if (metric.status === 'invalid') return 'Unavailable · No valid provider measurement';
  if (metric.collection_method === 'manual-export') return `Imported report · ${periodText(metric.period)} · Imported: ${metric.imported_at || 'not recorded'} · not automatically refreshed`;
  return `${ageStatus(metric.status,metric.last_success,now) === 'fresh' ? 'Verified' : 'Last recorded'} · ${periodText(metric.period)} · Retrieved: ${metric.last_success || 'not recorded'}`;
}
function parseDashboardData(source) {
  const assignment = source.match(/(?:^|\n)const DASHBOARD_DATA\s*=\s*(\{[\s\S]*\});?\s*$/);
  if (!assignment) throw new Error('Dashboard data format is invalid.');
  const data = JSON.parse(assignment[1]);
  if (!data.automation || !data.automation.source_status || Array.isArray(data.automation.source_status) || typeof data.automation.source_status !== 'object') throw new Error('Dashboard source records are missing.');
  return data;
}
function safeContentUrl(value, platform) {
  try {
    const url = new URL(value);
    const hosts = platform === 'instagram' ? ['instagram.com','www.instagram.com'] : platform === 'facebook' ? ['facebook.com','www.facebook.com','m.facebook.com','fb.watch'] : [];
    if (url.protocol !== 'https:' || url.username || url.password || !hosts.includes(url.hostname) || /\/l\.php$/.test(url.pathname)) return '';
    return url.href;
  } catch { return ''; }
}
// SVG avoids platform-dependent missing arrow glyphs; the text labels new-tab links.
const externalLinkIcon = '<svg class="external-link-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12 12 4M4 4h8v8"/></svg><span class="sr-only"> (opens in a new tab)</span>';
function renderTopContent(content, now = Date.now()) {
  if (!Array.isArray(content?.groups) || !Number.isFinite(Date.parse(content.collected_at))) return '';
  const current = ageStatus(content.status,content.collected_at,now) === 'fresh';
  const groups = content.groups.filter(group => group && ['instagram','facebook'].includes(String(group.platform).toLowerCase()) && Array.isArray(group.items) && group.items.length).map(group => ({...group,platform:String(group.platform).toLowerCase()}));
  if (!groups.length) return '';
  const renderGroup = group => {
    const items = group.items.slice(0,5);
    const renderPost = (item,index) => {
      const url = safeContentUrl(item.url,group.platform);
      const title = String(item.title || item.caption || 'View post').trim().slice(0,110);
      const metrics = Array.isArray(item.metrics) ? item.metrics.filter(metric => typeof metric.value === 'number' && Number.isFinite(metric.value) && typeof metric.label === 'string') : [];
      const primary = metrics[0];
      const secondary = metrics.slice(1);
      const badges = Array.isArray(item.badges) ? item.badges.filter(badge => ['Top reel','Most shared'].includes(badge)).slice(0,2) : [];
      return `<li class="post"><span class="post-rank">${String(index+1).padStart(2,'0')}</span><div>${url ? `<a class="post-title" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(title)} ${externalLinkIcon}</a>` : `<span class="post-title">${escapeHtml(title)}</span>`}<p class="post-meta">${escapeHtml(item.format || 'Post')} · ${escapeHtml(dateText(item.published_at))}</p>${badges.map(badge=>`<span class="post-badge">${escapeHtml(badge)}</span>`).join('')}${secondary.length ? `<details class="post-more"><summary>More results</summary><p class="post-extra">${secondary.map(metric=>`${escapeHtml(metric.label)}: ${metric.value.toLocaleString('en-US')}`).join('<br>')}</p></details>` : ''}</div>${primary ? `<div class="post-score"><strong>${primary.value.toLocaleString('en-US')}</strong><span>${escapeHtml(primary.label)}</span></div>` : ''}</li>`;
    };
    const scope = typeof group.scope === 'string' ? group.scope : '';
    const coverage = typeof group.coverage === 'string' ? group.coverage : '';
    return `<article class="content-group"><div class="content-heading"><h3>${escapeHtml(group.label || titleCase(group.platform))}</h3></div><p class="content-scope">${escapeHtml(scope)}</p><ol class="post-list">${items.slice(0,3).map(renderPost).join('')}</ol>${items.length>3 ? `<details class="more-posts"><summary>See all ${items.length} posts</summary><ol class="post-list" start="4">${items.slice(3).map((item,index)=>renderPost(item,index+3)).join('')}</ol></details>` : ''}${coverage ? `<p class="content-date">${escapeHtml(coverage)}</p>` : ''}</article>`;
  };
  return `<section id="top-content" aria-labelledby="content-title"><div class="section-heading"><h2 id="content-title">${current ? 'Top-performing content' : 'Content performance snapshot'}</h2><p>${current ? 'The posts getting attention' : 'Previously verified results'}</p></div><div class="content-grid${groups.length === 1 ? ' single' : ''}">${groups.map(renderGroup).join('')}</div><p class="summary-note">Ranked within each platform’s available posts. ${current ? 'Metrics retrieved ' : 'Snapshot from '}${escapeHtml(dateText(content.collected_at))}.${current ? '' : ' These results have not refreshed.'}</p></section>`;
}
function safeReviewUrl(value) {
  try {
    const url = new URL(value);
    if (url.protocol !== 'https:' || url.hostname !== 'maps.google.com' || url.port || url.username || url.password || url.pathname !== '/' || url.hash || !/^\d+$/.test(url.searchParams.get('cid') || '') || url.searchParams.getAll('cid').length !== 1 || [...url.searchParams.keys()].some(key=>key !== 'cid')) return '';
    return url.href;
  } catch { return ''; }
}
function renderReviewBenchmark(D, now = Date.now()) {
  const benchmark = D.review_benchmark;
  const rating = metricValue(D,'reviews','rating');
  const count = metricValue(D,'reviews','joyleaf_count');
  if (!benchmark || !Number.isFinite(Date.parse(benchmark.collected_at)) || !Array.isArray(benchmark.peers) || rating === null || rating < 1 || rating > 5 || !Number.isSafeInteger(count) || count < 0) return '';
  const seen = new Set();
  const peers = benchmark.peers.filter(peer => {
    if (!peer || typeof peer.name !== 'string' || !peer.name.trim() || typeof peer.rating !== 'number' || !Number.isFinite(peer.rating) || peer.rating < 1 || peer.rating > 5 || !Number.isSafeInteger(peer.review_count) || peer.review_count < 0 || !safeReviewUrl(peer.url) || seen.has(peer.url)) return false;
    seen.add(peer.url); return true;
  }).slice(0,8);
  if (!peers.length) return '';
  const rows = [...peers,{name:'Joyleaf · Roselle',rating,review_count:count,own:true}].sort((a,b)=>b.review_count-a.review_count);
  const maximum = Math.max(...rows.map(row=>row.review_count),1);
  const ownMeta = D.automation.source_status.reviews.metric_status;
  const delayed = ['rating','joyleaf_count'].some(key=>ageStatus(ownMeta[key].status,ownMeta[key].last_success,now) !== 'fresh');
  const ratingDate = dateText(ownMeta.rating.last_success);
  const countDate = dateText(ownMeta.joyleaf_count.last_success);
  const ownDate = ratingDate === countDate ? countDate : `rating ${ratingDate}, review count ${countDate}`;
  return `<section id="review-benchmark" aria-labelledby="benchmark-title"><div class="section-heading"><h2 id="benchmark-title">Google review benchmark</h2><p>Selected nearby dispensaries</p></div><div class="card benchmark-card"><table class="benchmark-table"><caption class="sr-only">Google ratings and total review counts for Joyleaf and selected nearby dispensaries</caption><thead><tr><th scope="col">Business</th><th scope="col">Rating</th><th scope="col">Total reviews</th></tr></thead><tbody>${rows.map(row=>`<tr${row.own ? ' class="own-business"' : ''}><td class="benchmark-name">${row.own ? escapeHtml(row.name) : `<a href="${escapeHtml(safeReviewUrl(row.url))}" target="_blank" rel="noopener noreferrer">${escapeHtml(row.name)} ${externalLinkIcon}</a>`}</td><td>${row.rating.toFixed(1)}<span class="sr-only"> out of 5</span></td><td><span class="benchmark-count">${row.review_count.toLocaleString('en-US')}</span><div class="benchmark-bar" aria-hidden="true"><span style="width:${(row.review_count/maximum*100).toFixed(2)}%"></span></div></td></tr>`).join('')}</tbody></table><p class="benchmark-note">Peer snapshots: ${escapeHtml(dateText(benchmark.collected_at))}. Joyleaf: ${escapeHtml(ownDate)}${delayed ? ' (last verified)' : ' · updated daily'}.<br>Peer figures are a dated check, not a daily feed. This compares review totals, not Google search rankings.</p></div></section>`;
}
function renderAiBaseline(audit, now = Date.now()) {
  const captured = Date.parse(audit?.collected_at);
  if (audit?.collection_method !== 'manual-browser-check' || !Number.isFinite(captured) || captured > now || !Array.isArray(audit.prompts) || !Array.isArray(audit.engines)) return '';
  const prompts = audit.prompts.filter(prompt => prompt.kind === 'discovery' && typeof prompt.id === 'string' && typeof prompt.text === 'string');
  if (prompts.length !== 3 || new Set(prompts.map(prompt=>prompt.id)).size !== 3) return '';
  const promptIds = new Set(prompts.map(prompt=>prompt.id));
  const names = {chatgpt:'ChatGPT',gemini:'Gemini',claude:'Claude'};
  const measured = [];
  for (const id of ['chatgpt','gemini','claude']) {
    const matches = audit.engines.filter(engine=>engine.id === id);
    if (matches.length !== 1) continue;
    const engine = matches[0];
    if (engine.status !== 'measured' || !Array.isArray(engine.checks)) continue;
    const checks = engine.checks.filter(check=>promptIds.has(check.prompt_id) && check.status === 'completed');
    if (checks.length !== 3 || new Set(checks.map(check=>check.prompt_id)).size !== 3 || checks.some(check=>typeof check.brand_mentioned !== 'boolean' || typeof check.website_linked !== 'boolean')) continue;
    const mentions = checks.filter(check=>check.brand_mentioned).length;
    const links = checks.filter(check=>check.website_linked).length;
    if (engine.discovery_completed !== checks.length || engine.brand_mentions !== mentions || engine.website_links !== links) continue;
    const branded = engine.checks.find(check=>check.prompt_id === 'branded_details' && check.status === 'completed');
    const accurate = branded?.website_correct === true && branded?.address_correct === true;
    measured.push({id,name:names[id],mentions,links,accurate,checks});
  }
  if (!measured.length) return '';
  const measuredIds = new Set(measured.map(engine=>engine.id));
  const cards = measured.map(engine=>`<article class="ai-card"><h3>${engine.name}</h3><p class="ai-result"><strong>${engine.mentions} of 3</strong> tested answers named Joyleaf</p><p class="ai-state">Website linked in ${engine.links} of 3 answers.</p>${engine.accurate ? '<p class="ai-accuracy">Separate website and address check: matched.</p>' : ''}${engine.id === 'chatgpt' && engine.checks.some(check=>check.mention_qualification === 'potentially_independent_not_verified') ? '<p class="ai-caveat">One mention was qualified: independent ownership was not confirmed, and no website was linked.</p>' : ''}</article>`).join('');
  const untested = ['chatgpt','gemini','claude'].filter(id=>!measuredIds.has(id)).map(id=>`${names[id]}: not tested${audit.engines.find(engine=>engine.id===id)?.status === 'blocked' ? ' (sign-in required)' : ''}.`).join(' ');
  return `<section class="ai-section" id="ai-search" aria-labelledby="ai-title"><div class="ai-heading"><div><h2 id="ai-title">AI answer presence</h2><p>Manual baseline · Checked ${escapeHtml(dateText(audit.collected_at))}</p></div><span class="pill">Dated check</span></div><div class="ai-grid${measured.length === 2 ? ' two' : ''}">${cards}</div>${untested ? `<p class="ai-note">${escapeHtml(untested)}</p>` : ''}<p class="ai-note">A small sample of three local questions, not a search ranking or a measure of customer traffic. Website links were explicitly requested. These checks do not update automatically.</p><details class="ai-method"><summary>Questions and method</summary><ol>${prompts.map(prompt=>`<li>${escapeHtml(prompt.text)}</li>`).join('')}</ol><p>One answer per question in a fresh conversation. ChatGPT used its logged-out default; Gemini used Flash in temporary chats. These are different product modes, and answers can change.</p><p>The separate branded check asked for Joyleaf’s official website and street address. It is excluded from the three discovery answers. A mention may be qualified and does not establish an endorsement or independently verify ownership.</p></details></section>`;
}

function createDashboard(D, now = Date.now()) {
  const statuses = D.automation.source_status;
  const names = {google:'Google Business Profile',instagram:'Instagram',facebook:'Facebook',youtube:'YouTube',linkedin:'LinkedIn',reviews:'Google Reviews',weedmaps:'Weedmaps',leafly:'Leafly',yelp:'Yelp'};
  const shownKeys = {google:['searches','website_clicks','direction_requests','phone_calls'],instagram:['views','interactions','new_follows'],facebook:['views','page_visits','interactions','new_follows'],youtube:['views','new_subs','subscribers'],linkedin:['impressions','reactions','followers'],reviews:['rating','joyleaf_count'],weedmaps:['unique_shoppers','orders','gmv','monthly_spend']};
  const automaticSources = ['google','instagram','facebook','youtube','linkedin','reviews'];
  const value = (source,key) => metricValue(D,source,key);
  const number = (source,key) => { const v = value(source,key); return v === null ? '—' : v.toLocaleString('en-US'); };
  const period = source => periodText(statuses[source]?.period);
  const fieldPeriod = (source,key) => periodText(statuses[source]?.metric_status?.[key]?.period);
  const fieldState = (source,key) => {
    if (value(source,key) === null) return 'unavailable';
    const metric = statuses[source].metric_status[key];
    if (metric.collection_method === 'manual-export') return 'imported';
    return ageStatus(metric.status,metric.last_success,now);
  };
  const displayedState = source => {
    const states = (shownKeys[source] || []).map(key => fieldState(source,key));
    if (states.every(state => state === 'fresh')) return 'fresh';
    if (states.some(state => state === 'fresh')) return 'partial';
    return states.some(state => state === 'stale') ? 'stale' : 'unavailable';
  };
  const pill = (text,state='') => `<span class="pill ${state}"><span class="pill-dot" aria-hidden="true"></span>${escapeHtml(text)}</span>`;
  const statusPill = source => {
    const state = displayedState(source);
    return pill(state === 'fresh' ? 'Updated daily' : state === 'partial' ? 'Some updates delayed' : state === 'stale' ? 'Update delayed' : 'Data unavailable',state === 'fresh' ? 'fresh' : 'stale');
  };
  const metric = (source,key,label=metricLabel(source,key,statuses)) => {
    const state = fieldState(source,key);
    const ownPeriod = fieldPeriod(source,key);
    const caption = ownPeriod !== period(source) ? ownPeriod : '';
    let display = number(source,key);
    if (source === 'weedmaps' && ['gmv','monthly_spend'].includes(key) && value(source,key) !== null) display = value(source,key).toLocaleString('en-US',{style:'currency',currency:'USD'});
    return `<div class="metric" data-metric="${source}.${key}"><div class="metric-value">${display}</div><div class="metric-label">${escapeHtml(label)}</div>${caption ? `<div class="metric-period">${escapeHtml(caption)}</div>` : ''}${['stale','unavailable'].includes(state) ? `<p class="status-note">${state === 'stale' ? 'Last verified value' : 'Not available'}</p>` : ''}</div>`;
  };
  const kpi = (source,key,label,sub,accent=false) => {
    const state = fieldState(source,key);
    const rating = value('reviews','rating');
    const display = key === 'rating' ? (rating === null ? '—' : rating.toFixed(1) + '<small> / 5</small>') : number(source,key);
    return `<article class="kpi${accent ? ' accent' : ''}" data-kpi="${source}.${key}"><p class="kpi-label">${escapeHtml(label)}</p><div class="kpi-value">${display}</div><p class="kpi-sub">${escapeHtml(sub)}</p><div class="kpi-foot">${escapeHtml(fieldPeriod(source,key))}${state !== 'fresh' ? '<br>' + pill(state === 'stale' ? 'Last verified value' : 'Not available','stale') : ''}</div></article>`;
  };
  const channel = (source,symbol,keys,note='') => `<article class="card${source === 'google' ? ' wide' : ''}"><div class="card-top"><div><div class="channel-name"><span class="channel-symbol" aria-hidden="true">${symbol}</span><h3>${names[source]}</h3></div><p class="card-period">${escapeHtml(period(source))}</p></div>${statusPill(source)}</div><div class="metric-grid${keys.length === 4 ? ' four' : ''}">${keys.map(key=>metric(source,key)).join('')}</div>${note ? `<p class="small-note">${escapeHtml(note)}</p>` : ''}</article>`;
  const currentSources = automaticSources.filter(source => displayedState(source) === 'fresh').length;
  const successful = automaticSources.map(source=>statuses[source]?.last_success).filter(time=>Number.isFinite(Date.parse(time)) && Date.parse(time) <= now).sort();
  const latest = successful.at(-1);
  const reviewCount = value('reviews','joyleaf_count');
  let reviewSub = reviewCount === null ? 'Review count not available' : `${reviewCount.toLocaleString('en-US')} Google reviews`;
  if (reviewCount !== null && fieldState('reviews','joyleaf_count') !== 'fresh') reviewSub += ' · last recorded';
  if (reviewCount !== null && fieldPeriod('reviews','joyleaf_count') !== fieldPeriod('reviews','rating')) reviewSub += ' · ' + fieldPeriod('reviews','joyleaf_count');
  const manual = statuses.weedmaps?.manual_import;
  const importedReport = manual ? `<section aria-labelledby="report-title"><div class="section-heading"><h2 id="report-title">Imported report</h2><p>A dated report, separate from daily feeds</p></div><article class="card report-card"><div class="card-top"><div><h3>Weedmaps storefront</h3><p class="card-period">${escapeHtml(periodText(manual.period))} · Imported ${escapeHtml(dateText(manual.imported_at))}</p></div>${pill('Imported report')}</div><div class="metric-grid four">${shownKeys.weedmaps.map(key=>metric('weedmaps',key)).join('')}</div><p class="report-description">Storefront only. This report does not update automatically. Modeled opportunity GMV is excluded.</p></article></section>` : '';
  return `<section id="overview" aria-labelledby="page-title"><div class="hero"><div><p class="eyebrow">Joyleaf · Roselle, NJ</p><h1 id="page-title">Your marketing, at a glance.</h1><p class="hero-description">How people discover Joyleaf, engage with your content, and review their experience.</p></div><div class="update-note">${pill(currentSources === automaticSources.length ? 'Daily reporting' : 'Some updates need attention',currentSources === automaticSources.length ? 'fresh' : 'stale')}<p>${latest ? 'Latest successful refresh: ' + escapeHtml(dateText(latest)) : 'No successful refresh recorded'}</p></div></div><div class="kpi-grid">${kpi('google','searches','Google visibility','Search & Maps impressions',true)}${kpi('google','direction_requests','Direction requests','From your Google profile')}${kpi('instagram','views','Instagram views','Content views')}${kpi('reviews','rating','Google rating',reviewSub)}</div><p class="summary-note">Daily updates, not real-time. Each metric uses the reporting dates shown.</p></section>
  ${renderTopContent(D.top_content,now)}
  ${renderReviewBenchmark(D,now)}
  <section id="channels" aria-labelledby="channels-title"><div class="section-heading"><h2 id="channels-title">Channel performance</h2><p>Latest available reporting period by platform</p></div><div class="channel-grid">${channel('google','G',['website_clicks','direction_requests','phone_calls'],'Profile actions show customer interest. They are not confirmed store visits or sales.')}${channel('instagram','IG',['views','interactions','new_follows'])}${channel('facebook','f',['views','page_visits','interactions','new_follows'])}${channel('youtube','YT',['views','new_subs','subscribers'])}${channel('linkedin','in',['impressions','reactions','followers'])}</div></section>
  ${importedReport}
  ${renderAiBaseline(D.ai_search,now)}
  <p class="reporting-note">Dates are shown beside each measure. Daily feeds may lag; imported reports and AI checks are dated snapshots.</p>`;
}
async function renderDashboard() {
  // A new request on every visit prevents cached data from being paired with a newer page.
  const response = await fetch(`data.js?refresh=${Date.now()}`,{cache: 'no-store'});
  if (!response.ok) throw new Error('Dashboard data is unavailable.');
  const data = parseDashboardData(await response.text());
  const root = document.getElementById('dashboard');
  root.innerHTML = createDashboard(data);
  root.setAttribute('aria-busy','false');
  // Old bookmarks still land on the relevant section without restoring the old clutter.
  const aliases = {'#social':'channels','#seo':'channels','#reviews':'review-benchmark','#listings':'channels','#sources':'channels','#ai':'ai-search'};
  const target = document.getElementById(aliases[location.hash] || location.hash.slice(1));
  if (target) { if (target.tagName === 'DETAILS') target.open = true; target.scrollIntoView(); }
}
// Bootstrap is kept separate so the pure renderer can be regression-tested without a browser.
renderDashboard().catch(() => {
  const root = document.getElementById('dashboard');
  root.setAttribute('aria-busy','false');
  root.innerHTML = '<section class="error-state" role="alert"><h1>Data unavailable</h1><p>The latest results could not be loaded. No current metrics can be verified.</p><a href="">Reload dashboard</a></section>';
});
document.querySelectorAll('nav a').forEach(link => link.addEventListener('click',() => {
  const details = document.getElementById(link.getAttribute('href').slice(1));
  if (details?.tagName === 'DETAILS') details.open = true;
}));
</script>
