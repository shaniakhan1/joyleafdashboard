name: Joyleaf dashboard refresh

on:
  schedule:
    # Refresh provider metrics daily; upstream reporting windows and lag are shown on the dashboard.
    - cron: "17 13 * * *"
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/joyleaf-dashboard-refresh.yml"
      - "automation/make/mappings/field-map.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: joyleaf-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh_dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the existing dashboard repository
        uses: actions/checkout@v4

      - name: Check provider parsing and stale-data regression tests
        run: node --test .github/scripts/*.test.mjs

      - name: Collect provider metrics (AI insight remains weekly)
        env:
          JOYLEAF_SOURCE_CONFIG: ${{ secrets.JOYLEAF_SOURCE_CONFIG }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_LOCATION_NAME: ${{ secrets.GOOGLE_LOCATION_NAME }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/collect_live_metrics.mjs data.js /tmp/joyleaf-refresh-payload.json

      - name: Merge fresh metrics and retain stale values on any source failure
        run: node .github/scripts/merge_dashboard_data.mjs data.js /tmp/joyleaf-refresh-payload.json data.js

      - name: Commit data changes only when dashboard data changed
        run: |
          if git diff --quiet -- data.js; then
            echo "No dashboard data changes to commit."
            exit 0
          fi
          git config user.name "joyleaf-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "chore(data): refresh Joyleaf dashboard"
          git push
