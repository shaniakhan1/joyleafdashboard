name: Joyleaf dashboard refresh

on:
  schedule:
    # Monday 13:00 UTC / 08:00–09:00 America/Chicago depending on daylight saving time.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: joyleaf-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh_dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the existing dashboard repository
        uses: actions/checkout@v4

      - name: Collect live provider metrics and generate one insight
        env:
          JOYLEAF_SOURCE_CONFIG: ${{ secrets.JOYLEAF_SOURCE_CONFIG }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_LOCATION_NAME: ${{ secrets.GOOGLE_LOCATION_NAME }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/collect_live_metrics.mjs data.js /tmp/joyleaf-refresh-payload.json

      - name: Merge fresh metrics and retain stale values on any source failure
        run: node .github/scripts/merge_dashboard_data.mjs data.js /tmp/joyleaf-refresh-payload.json data.js

      - name: Commit data changes only when dashboard data changed
        run: |
          if git diff --quiet -- data.js; then
            echo "No dashboard data changes to commit."
            exit 0
          fi
          git config user.name "joyleaf-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "chore(data): refresh Joyleaf dashboard"
          git push
